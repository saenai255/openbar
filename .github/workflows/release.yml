name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # A stable signing identity keeps users' Accessibility grants across updates.
      - name: Import signing identity
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "::warning::SIGNING_P12 not set; building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=OpenBar Release Signing" >> "$GITHUB_ENV"

      - name: Build app
        run: UNIVERSAL=1 BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Package DMG
        run: |
          ./scripts/make-dmg.sh
          shasum -a 256 "build/OpenBar-$VERSION.dmg" | cut -d' ' -f1 > build/sha256.txt
          echo "SHA256=$(cat build/sha256.txt)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/OpenBar-$VERSION.dmg" \
            --title "OpenBar $VERSION" --generate-notes --verify-tag

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN not set; update saenai255/homebrew-tap manually (version $VERSION, sha256 $SHA256)."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/saenai255/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/openbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "openbar $VERSION"
          git push

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
