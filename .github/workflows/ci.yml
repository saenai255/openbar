name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Package DMG
        run: VERSION="0.0.0-${GITHUB_SHA::7}" ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBar-dmg
          path: build/*.dmg
          retention-days: 14
